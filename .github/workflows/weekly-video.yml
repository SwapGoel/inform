name: Weekly video refresh

on:
  schedule:
    - cron: "0 3 * * 1" # Monday 08:30 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: content-pipeline/package-lock.json
      - run: npm ci
      - run: npm run videos:weekly
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commit and push updated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet && echo "No content changes." || git commit -m "Weekly video refresh $(date -u +%Y-%m-%d)"
          git push
