name: Publish static content

# Manual only — rerun whenever data/evergreen_facts.json or data/theme.json
# change. Idempotent: safe to rerun any time.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: content-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: content-pipeline/package-lock.json
      - run: npm ci
      - run: npm run publish:static
      - name: Commit and push updated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content
          git diff --cached --quiet && echo "No content changes." || git commit -m "Publish static content"
          git push
