name: inform
description: "General-knowledge wallpaper cards, a daily mind game, and educational videos — no login, no server, no ads."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  wallpaper_manager_flutter: ^1.0.1
  url_launcher: ^6.3.1
  youtube_player_iframe: ^5.2.1
  workmanager: ^0.10.0
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/content/evergreen_facts.json
    - assets/content/theme.json
    - assets/content/external_games.json

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
